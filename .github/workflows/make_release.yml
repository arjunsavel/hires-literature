name: Publish Release
on:
  push:
    paths:
      - '**.cff'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Get version from CITATION.cff
        id: version
        run: echo "version=$(grep '^version:' CITATION.cff | awk '{print $2}' | tr -d '\"')" >> "$GITHUB_OUTPUT"
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
